<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte sectorielle — PTFE Orléans St Jean</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#12151c; --panel:#1a1f2a; --panel2:#222837; --border:#2e3648;
  --txt:#e8ecf4; --muted:#8c96ab; --accent:#4da3ff; --warn:#ffb14d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;overflow:hidden}
#sidebar{width:350px;min-width:350px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:1000}
#sidebar header{padding:12px 16px;border-bottom:1px solid var(--border)}
#sidebar h1{font-size:15px;font-weight:700}
#sidebar h1 span{color:var(--accent)}
#sidebar .sub{font-size:11px;color:var(--muted);margin-top:2px}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tabs button{flex:1;background:none;border:none;color:var(--muted);padding:9px 0;font-size:12px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
#controls{padding:8px 14px;border-bottom:1px solid var(--border);display:flex;gap:6px}
#controls button{flex:1;background:var(--panel2);color:var(--txt);border:1px solid var(--border);border-radius:6px;padding:6px 4px;font-size:11px;cursor:pointer}
#controls button:hover{border-color:var(--accent);color:var(--accent)}
#modeRow{padding:7px 14px;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px}
#modeRow select{background:var(--panel2);color:var(--txt);border:1px solid var(--border);border-radius:5px;padding:3px 6px;font-size:11px}
#search{margin:8px 14px 2px;display:block;width:calc(100% - 28px);background:var(--panel2);border:1px solid var(--border);color:var(--txt);border-radius:6px;padding:7px 10px;font-size:12px}
#search:focus{outline:none;border-color:var(--accent)}
.list{flex:1;overflow-y:auto;padding:6px 8px 12px}
.zone-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;user-select:none;flex-wrap:wrap}
.zone-item:hover{background:var(--panel2)}
.zone-item input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;flex-shrink:0}
.swatch{width:13px;height:13px;border-radius:4px;flex-shrink:0;border:1px solid rgba(255,255,255,.25)}
.zone-info{flex:1;min-width:0;cursor:pointer}
.zone-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zone-code{font-size:10px;color:var(--muted)}
.zone-stats{font-size:10px;color:var(--muted);text-align:right;flex-shrink:0;line-height:1.45}
.zone-del{color:var(--muted);font-size:13px;cursor:pointer;padding:0 3px;flex-shrink:0}
.zone-del:hover{color:#ff6b6b}
.zone-item.off .zone-name,.zone-item.off .zone-code,.zone-item.off .zone-stats{opacity:.4}
.zone-item.off .swatch{opacity:.25}
.daychips{display:flex;gap:3px;width:100%;padding-left:23px;margin-top:3px}
.daychips span{font-size:9px;font-weight:700;width:20px;height:17px;display:flex;align-items:center;justify-content:center;border-radius:4px;border:1px solid var(--border);color:var(--muted);cursor:pointer}
.daychips span.on{background:var(--accent);border-color:var(--accent);color:#0d1017}
#newZoneForm{display:none;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel2)}
#newZoneForm.on{display:block}
#newZoneForm input[type=text]{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--txt);border-radius:5px;padding:6px 8px;font-size:12px;margin-bottom:6px}
#newZoneForm .row{display:flex;gap:6px;align-items:center}
#newZoneForm input[type=color]{width:36px;height:30px;border:none;background:none;cursor:pointer;padding:0}
#newZoneForm button{flex:1;background:var(--accent);color:#0d1017;border:none;border-radius:5px;padding:6px;font-size:12px;font-weight:700;cursor:pointer}
#newZoneForm .hint{font-size:10px;color:var(--muted);margin-top:5px}
#footerStats{padding:8px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
#footerStats b{color:var(--txt)}
#paintBar{padding:8px 14px;border-bottom:1px solid var(--border);font-size:11px;background:#231d12;display:none;align-items:center;gap:8px}
#paintBar.on{display:flex}
#paintBar select{background:var(--panel2);color:var(--txt);border:1px solid var(--border);border-radius:5px;padding:3px 6px;font-size:11px;flex:1}
#paintBar .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.3}}
#editBtnRow{padding:8px 14px;border-bottom:1px solid var(--border);display:flex;gap:6px}
#editBtnRow button{flex:1;background:var(--panel2);color:var(--txt);border:1px solid var(--border);border-radius:6px;padding:6px;font-size:11px;cursor:pointer}
#editBtnRow button.active{background:var(--warn);color:#1a1208;border-color:var(--warn);font-weight:700}
#modifBadge{font-size:10px;color:var(--warn)}
#map{flex:1;background:#0d1017}
#loading{position:absolute;inset:0;background:rgba(13,16,23,.92);z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#loading .spin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loading p{font-size:13px;color:var(--muted);text-align:center;padding:0 20px}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--txt);border-radius:8px;border:1px solid var(--border)}
.leaflet-popup-tip{background:var(--panel)}
.pop h3{font-size:13px;margin-bottom:6px}
.pop table{font-size:11px;border-collapse:collapse}
.pop td{padding:2px 6px 2px 0;color:var(--muted)}
.pop td:last-child{color:var(--txt);font-weight:600}
.pop .zbadge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;margin-top:6px}
.pop select{margin-top:8px;width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--border);border-radius:5px;padding:4px;font-size:11px}
.pop .lbl{font-size:10px;color:var(--muted);margin-top:8px;display:block}
.leaflet-container{font-family:inherit}
#histOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:3000;display:none;align-items:center;justify-content:center}
#histOverlay.on{display:flex}
#histPanel{background:var(--panel);border:1px solid var(--border);border-radius:10px;width:min(560px,92vw);max-height:82vh;display:flex;flex-direction:column}
#histPanel header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
#histPanel header h2{font-size:14px}
#histPanel header .x{cursor:pointer;color:var(--muted);font-size:18px;padding:0 4px}
#histPanel header .x:hover{color:var(--txt)}
#histBody{overflow-y:auto;padding:10px 14px;flex:1}
#histBody h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px}
.hist-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:12px}
.hist-row:hover{background:var(--panel2)}
.hist-row .swatch{width:11px;height:11px}
.hist-row .info{flex:1;min-width:0}
.hist-row .info small{color:var(--muted);font-size:10px;display:block}
.hist-row .del{cursor:pointer;color:var(--muted);font-size:14px;padding:2px 5px;flex-shrink:0}
.hist-row .del:hover{color:#ff6b6b}
.hist-empty{font-size:12px;color:var(--muted);padding:6px 8px;font-style:italic}
#histFooter{padding:10px 14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#histFooter button{background:var(--panel2);color:#ff6b6b;border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:11px;cursor:pointer}
#histFooter button:hover{border-color:#ff6b6b}
#histFooter span{font-size:11px;color:var(--muted)}
body:not(.edit) .editonly{display:none !important}
#btnLock.unlocked{background:#1d2b1f;border-color:#34d399;color:#34d399}
#toggleSidebar{display:none}
@media(max-width:760px){
  #sidebar{position:absolute;left:0;top:0;bottom:0;transform:translateX(-100%);transition:.25s}
  #sidebar.open{transform:none}
  #toggleSidebar{display:block;position:absolute;top:12px;left:12px;z-index:1500;background:var(--panel);color:var(--txt);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px}
}
</style>
</head>

<div id="sidebar">
  <header>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">

    </div>

    <button id="btnReset" title="Historique des modifications">🕘</button>

    <select id="paintTarget"></select>

  <div id="controls">
    <button id="btnAll">Tout cocher</button>
    <button id="btnNone">Tout décocher</button>
  </div>
  <div id="modeRow">
    Non cochées :
    <select id="hideMode">
      <option value="fade">estompées</option>
      <option value="hide">masquées</option>
    </select>
    <label style="display:flex;align-items:center;gap:5px;cursor:pointer;margin-left:auto">
      <input type="checkbox" id="chkLabels" checked style="accent-color:var(--accent)"> Noms des villes
    </label>
  </div>
  <input id="search" type="text" placeholder="Commune, code INSEE ou code postal… (Entrée)">
  <div class="list" id="zoneList"></div>
  <div class="list" id="dayList" style="display:none"></div>
  <div id="footerStats"></div>
</div>
<button id="toggleSidebar">☰ Menu</button>
<div id="map"></div>
<div id="loading"><div class="spin"></div><p id="loadMsg">Chargement des contours communaux…</p></div>
<div id="histOverlay">
  <div id="histPanel">
    <header><h2>🕘 Historique des modifications</h2><span class="x" id="histClose">✕</span></header>
    <div id="histBody"></div>
    <div id="histFooter"><span id="histCount"></span><button id="histResetAll" class="editonly">Tout annuler</button></div>
  </div>
</div>
<input type="file" id="fileImport" accept=".json" style="display:none">

localStorage.setItem('cartoSectoSite', SITE);
const CFG = SITES[SITE];
const BASE = CFG.data;            // insee: [commune, cp, zoneOrigine, lib, cumul]
const BASEZONES = CFG.zones;      // code -> libellé
const BASECOLORS = CFG.colors;    // code -> couleur
const DEPTS = CFG.depts;
const LSKEY = 'carteSecto_'+SITE;

const DAYS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const NODAY = '__none__';

const DAYCOLORS = {Lun:'#ff6b6b',Mar:'#ffa94d',Mer:'#ffd43b',Jeu:'#69db7c',Ven:'#4dabf7',Sam:'#b197fc',Dim:'#f783ac'};
DAYCOLORS[NODAY]='#5a6378';

const firebaseConfig={apiKey:"AIzaSyDnjxRbAzDJPMUcvoNsB5hoHQnMTP7lZb4",authDomain:"belote-us-seignelay.firebaseapp.com",databaseURL:"https://belote-us-seignelay-default-rtdb.europe-west1.firebasedatabase.app",projectId:"belote-us-seignelay",storageBucket:"belote-us-seignelay.firebasestorage.app",messagingSenderId:"881100486907",appId:"1:881100486907:web:a04a29dd9683ad8fa9d85e"};
let db=null, firebaseOk=false, _saving=false;

// ---- état partagé ----
let mdp = 'PTFE45';               // mot de passe édition (modifiable via 🔑, stocké dans Firebase)
let editMode = sessionStorage.getItem('cartoSectoEdit')==='1';
function isEdit(){ return editMode; }
let overrides = {};               // insee -> zone
let zoneDays = {};                // zone -> [jours]
let customZones = {};             // code -> {lib, color}
let overridesMeta = {};           // insee -> date ISO de la réaffectation
try{
  const s = JSON.parse(localStorage.getItem(LSKEY)||'{}');
  overrides=s.overrides||{}; zoneDays=s.zoneDays||{}; customZones=s.customZones||{}; overridesMeta=s.overridesMeta||{};
}catch(e){}

// helpers zones (base + personnalisées)
const ZNA='ZNA';
function allZones(){ const o={...BASEZONES}; Object.entries(customZones).forEach(([c,z])=>o[c]=z.lib); o[ZNA]='NON AFFECTÉ'; return o; }
function zoneLib(z){ return BASEZONES[z] || (customZones[z]&&customZones[z].lib) || z; }
function zoneColor(z){ if(z===ZNA) return '#5a6378'; return BASECOLORS[z] || (customZones[z]&&customZones[z].color) || '#888'; }
function nextZoneCode(){ let n=21; while(BASEZONES['OLI'+String(n).padStart(2,'0')]||customZones['OLI'+String(n).padStart(2,'0')]) n++; return 'OLI'+String(n).padStart(2,'0'); }

function setSync(ok){
  const b=document.getElementById('syncBadge');
  firebaseOk=ok;
  b.textContent = ok?'⬤ synchronisé':'⬤ hors ligne';
  b.style.color = ok?'#34d399':'#5a6378';
}
function initFirebase(){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    db.ref('.info/connected').on('value',s=>{ setSync(!!s.val()); console.log('Firebase connected:', !!s.val()); });
    db.ref(CFG.fbNode).on('value',snap=>{
      if(_saving || save._failed) return;
      const d = snap.val();
      if(!d) return;
      if(d.mdp) mdp=d.mdp;
      const remote = JSON.stringify({o:d.overrides||{}, z:d.zoneDays||{}, c:d.customZones||{}});
      const local  = JSON.stringify({o:overrides, z:zoneDays, c:customZones});
      if(remote===local) return;
      overrides=d.overrides||{}; zoneDays=d.zoneDays||{}; customZones=d.customZones||{}; overridesMeta=d.overridesMeta||{};
      if(d.mdp) mdp=d.mdp;
      localStorage.setItem(LSKEY, JSON.stringify({overrides, zoneDays, customZones, overridesMeta}));
      ensureChecks(); buildZoneList(); buildDayList(); buildPaintSel(); updateBadge(); refreshMap();
    });
  }catch(e){ setSync(false); }
}
function save(){
  localStorage.setItem(LSKEY, JSON.stringify({overrides, zoneDays, customZones, overridesMeta}));
  updateBadge();
  if(db){
    _saving=true;
    db.ref(CFG.fbNode).set({overrides, zoneDays, customZones, overridesMeta, mdp, maj:new Date().toISOString()})
      .then(()=>{ setTimeout(()=>_saving=false,800); save._failed=false; setSync(true); })
      .catch(err=>{
        _saving=false; save._failed=true;
        const b=document.getElementById('syncBadge');
        b.textContent='⚠ écriture échouée ('+(err&&err.code||err)+')';
        b.style.color='#ff6b6b';
        console.error('Firebase write:',err);
        setTimeout(()=>{ if(save._failed) save(); }, 3000);
      });
  }
}

// ---- vues / filtres ----
let viewMode='zone', hideMode='fade', paintMode=false;
const zChecked={}, dChecked={};
DAYS.concat([NODAY]).forEach(d=>dChecked[d]=true);
function ensureChecks(){ Object.keys(allZones()).forEach(z=>{ if(!(z in zChecked)) zChecked[z]=(z!==ZNA); }); }
ensureChecks();

const map = L.map('map').setView(CFG.center,8);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:18}).addTo(map);
// libellés des villes rendus AU-DESSUS des polygones colorés
map.createPane('labels');
map.getPane('labels').style.zIndex=650;
map.getPane('labels').style.pointerEvents='none';
const labelLayer=L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',{pane:'labels',maxZoom:18}).addTo(map);
document.getElementById('chkLabels').addEventListener('change',e=>{
  if(e.target.checked) labelLayer.addTo(map); else map.removeLayer(labelLayer);
});
const layersByInsee = {};
const geoGroup = L.featureGroup().addTo(map);

function zoneOf(insee){ return overrides[insee] || BASE[insee][2]; }
function daysOf(insee){ const d=zoneDays[zoneOf(insee)]||[]; return d.length?d:[NODAY]; }
function isVisible(insee){
  if(viewMode==='zone') return zChecked[zoneOf(insee)]!==false;
  return daysOf(insee).some(d=>dChecked[d]);
}
function colorFor(insee){
  return zoneColor(zoneOf(insee));   // même couleur de zone dans les deux vues
}
function styleFor(insee){
  if(isVisible(insee)) return {color:'#0d1017',weight:.8,fillColor:colorFor(insee),fillOpacity:.78,opacity:1};
  if(hideMode==='hide') return {opacity:0,fillOpacity:0};
  return {color:'#0d1017',weight:.5,fillColor:'#3a4254',fillOpacity:.25,opacity:1};
}
function refreshMap(){ Object.keys(layersByInsee).forEach(i=>layersByInsee[i].setStyle(styleFor(i))); updateStats(); }

// ---- popup ----
function popupHtml(insee){
  const [commune,cp,,,cumul]=BASE[insee];
  const z=zoneOf(insee), c=zoneColor(z), orig=BASE[insee][2];
  const opts=Object.entries(allZones()).map(([zz,lib])=>
    `<option value="${zz}" ${zz===z?'selected':''}>${zz} — ${lib}</option>`).join('');
  const days=(zoneDays[z]||[]).join(' · ')||'—';
  return `<div class="pop"><h3>${commune}</h3><table>
    <tr><td>Code INSEE</td><td>${insee}</td></tr>
    <tr><td>Code postal</td><td>${cp}</td></tr>
    <tr><td>Volume cumul</td><td>${cumul.toLocaleString('fr-FR')}</td></tr>
    <tr><td>Jour(s)</td><td>${days}</td></tr>
  </table>
  <span class="zbadge" style="background:${c}22;color:${c};border:1px solid ${c}66">${z} · ${zoneLib(z)}${overrides[insee]?' (modifié, origine '+orig+')':''}</span>
  ${isEdit()?`<label class="lbl">Réaffecter à la zone :</label>
  <select onchange="reassign('${insee}',this.value)">${opts}</select>`:''}</div>`;
}
window.reassign=function(insee,z){
  if(!isEdit()) return;
  if(z===BASE[insee][2]){ delete overrides[insee]; delete overridesMeta[insee]; }
  else{ overrides[insee]=z; overridesMeta[insee]=new Date().toISOString(); }
  save(); buildZoneList(); refreshMap();
  if(layersByInsee[insee]&&layersByInsee[insee].isPopupOpen()) layersByInsee[insee].setPopupContent(popupHtml(insee));
};

// ---- geojson ----
async function fetchGeo(dept){
  const slug=DEPTS[dept];
  const urls=[
    `https://france-geojson.gregoiredavid.fr/repo/departements/${slug}/communes-${slug}.geojson`,
    `https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements/${slug}/communes-${slug}.geojson`
  ];
  for(const u of urls){ try{ const r=await fetch(u); if(r.ok) return await r.json(); }catch(e){} }
  throw new Error('Échec '+slug);
}
async function init(){
  const msg=document.getElementById('loadMsg'); let done=0;
  try{
    const results=await Promise.all(Object.keys(DEPTS).map(async d=>{
      const g=await fetchGeo(d); done++; msg.textContent=`Contours : ${done}/${Object.keys(DEPTS).length} départements…`; return g;
    }));
    let added=0;
    results.forEach(geo=>geo.features.forEach(f=>{
      const insee=f.properties.code;
      if(!BASE[insee]){
        BASE[insee]=[(f.properties.nom||insee).toUpperCase(),'—',ZNA,'NON AFFECTÉ',0];
        added++;
      }
      const lyr=L.geoJSON(f,{style:()=>styleFor(insee)});
      lyr.bindPopup(()=>popupHtml(insee));
      lyr.on('click',e=>{
        if(paintMode&&isEdit()){ L.DomEvent.stop(e); lyr.closePopup(); reassign(insee, document.getElementById('paintTarget').value); }
      });
      lyr.on('mouseover',()=>{ if(isVisible(insee)) lyr.setStyle({weight:2.2,color:'#fff'}); });
      lyr.on('mouseout',()=>lyr.setStyle(styleFor(insee)));
      layersByInsee[insee]=lyr; geoGroup.addLayer(lyr);
    }));
    map.fitBounds(geoGroup.getBounds().pad(0.02));
    document.getElementById('loading').remove();
    console.log(added+' communes hors fichier ajoutées en NON AFFECTÉ');
    const manquants=Object.keys(BASE).filter(i=>!layersByInsee[i]);
    if(manquants.length) console.warn('Codes INSEE du fichier sans contour (fusion de communes ?):', manquants.map(i=>i+' '+BASE[i][0]).join(', '));
    buildZoneList(); buildDayList(); updateStats();
  }catch(e){
    msg.innerHTML='Erreur de chargement des contours.<br>Vérifie ta connexion puis recharge.<br><small>'+e.message+'</small>';
    document.querySelector('#loading .spin').style.display='none';
  }
}

// ---- listes ----
function zoneCounts(){
  const c={}; Object.keys(allZones()).forEach(z=>c[z]={n:0,vol:0});
  Object.keys(BASE).forEach(i=>{ const z=zoneOf(i); if(!c[z])c[z]={n:0,vol:0}; c[z].n++; c[z].vol+=BASE[i][4]; });
  return c;
}
function buildZoneList(){
  ensureChecks();
  const counts=zoneCounts();
  const list=document.getElementById('zoneList'); list.innerHTML='';
  Object.entries(allZones()).forEach(([z,lib])=>{
    const isCustom=!!customZones[z]; const isZna=(z===ZNA);
    const div=document.createElement('div');
    div.className='zone-item'+(zChecked[z]?'':' off');
    const chips=isZna?'':DAYS.map(d=>`<span data-day="${d}" class="${(zoneDays[z]||[]).includes(d)?'on':''}" ${isEdit()?'':'style="pointer-events:none;opacity:.55"'}>${d}</span>`).join('');
    div.innerHTML=`<input type="checkbox" ${zChecked[z]?'checked':''}>
      <span class="swatch" style="background:${zoneColor(z)}"></span>
      <span class="zone-info"><div class="zone-name">${lib}</div><div class="zone-code">${isZna?'communes sans secteur':z+(isCustom?' · perso':'')}</div></span>
      <span class="zone-stats">${counts[z].n} com.<br>${counts[z].vol.toLocaleString('fr-FR')}</span>
      ${isCustom&&!isZna&&isEdit()?'<span class="zone-del" title="Supprimer cette zone">✕</span>':''}
      <div class="daychips">${chips}</div>`;
    div.querySelector('input').addEventListener('change',e=>{ zChecked[z]=e.target.checked; div.classList.toggle('off',!zChecked[z]); refreshMap(); });
    div.querySelectorAll('.daychips span').forEach(sp=>{
      sp.addEventListener('click',()=>{
        if(!isEdit()) return;
        const d=sp.dataset.day; zoneDays[z]=zoneDays[z]||[];
        const ix=zoneDays[z].indexOf(d);
        if(ix>=0) zoneDays[z].splice(ix,1); else zoneDays[z].push(d);
        sp.classList.toggle('on'); save(); buildDayList();
        if(viewMode==='day') refreshMap(); else updateStats();
      });
    });
    const del=div.querySelector('.zone-del');
    if(del) del.addEventListener('click',()=>{
      if(!isEdit()) return;
      const nb=counts[z].n;
      if(!confirm(`Supprimer la zone ${z} — ${lib} ?`+(nb?`\n${nb} commune(s) retourneront à leur zone d'origine.`:''))) return;
      Object.keys(overrides).forEach(i=>{ if(overrides[i]===z){ delete overrides[i]; delete overridesMeta[i]; } });
      delete customZones[z]; delete zoneDays[z]; delete zChecked[z];
      save(); buildZoneList(); buildDayList(); buildPaintSel(); refreshMap();
    });
    list.appendChild(div);
  });
}
function dayCounts(){
  const c={}; DAYS.concat([NODAY]).forEach(d=>c[d]={n:0,vol:0});
  Object.keys(BASE).forEach(i=>daysOf(i).forEach(d=>{ c[d].n++; c[d].vol+=BASE[i][4]; }));
  return c;
}
function buildDayList(){
  const counts=dayCounts();
  const list=document.getElementById('dayList'); list.innerHTML='';
  DAYS.concat([NODAY]).forEach(d=>{
    const isN=d===NODAY;
    const zlist=Object.keys(allZones()).filter(z=>isN?!(zoneDays[z]||[]).length:(zoneDays[z]||[]).includes(d));
    const div=document.createElement('div');
    div.className='zone-item'+(dChecked[d]?'':' off');
    const sw=Object.keys(allZones()).filter(z=>isN?!(zoneDays[z]||[]).length:(zoneDays[z]||[]).includes(d)).slice(0,5).map(z=>`<span class="swatch" style="background:${zoneColor(z)};width:10px;height:10px"></span>`).join('');
    div.innerHTML=`<input type="checkbox" ${dChecked[d]?'checked':''}>
      <span style="display:flex;gap:2px;flex-shrink:0;min-width:14px">${sw||'<span class="swatch" style="background:transparent;border-color:transparent"></span>'}</span>
      <span class="zone-info"><div class="zone-name">${isN?'Non planifié':({Lun:'Lundi',Mar:'Mardi',Mer:'Mercredi',Jeu:'Jeudi',Ven:'Vendredi',Sam:'Samedi',Dim:'Dimanche'})[d]}</div>
      <div class="zone-code">${zlist.length?zlist.join(', '):'aucune zone'}</div></span>
      <span class="zone-stats">${counts[d].n} com.<br>${counts[d].vol.toLocaleString('fr-FR')}</span>`;
    div.querySelector('input').addEventListener('change',e=>{ dChecked[d]=e.target.checked; div.classList.toggle('off',!dChecked[d]); refreshMap(); });
    list.appendChild(div);
  });
}

// ---- stats / badge ----
function updateStats(){
  let n=0,vol=0;
  Object.keys(BASE).forEach(i=>{ if(isVisible(i)){ n++; vol+=BASE[i][4]; } });
  document.getElementById('footerStats').innerHTML=`Sélection : <b>${n}</b> communes · <b>${vol.toLocaleString('fr-FR')}</b> volume cumul`;
}
function updateBadge(){
  const n=Object.keys(overrides).length;
  document.getElementById('modifBadge').textContent=n?`${n} réaffectation(s)`:'';
}

// ---- onglets ----
function setView(v){
  viewMode=v;
  document.getElementById('tabZones').classList.toggle('active',v==='zone');
  document.getElementById('tabJours').classList.toggle('active',v==='day');
  document.getElementById('zoneList').style.display=v==='zone'?'':'none';
  document.getElementById('dayList').style.display=v==='day'?'':'none';
  refreshMap();
}
document.getElementById('tabZones').onclick=()=>setView('zone');
document.getElementById('tabJours').onclick=()=>setView('day');
document.getElementById('btnAll').onclick=()=>{
  if(viewMode==='zone'){ Object.keys(zChecked).forEach(z=>zChecked[z]=true); buildZoneList(); }
  else{ Object.keys(dChecked).forEach(d=>dChecked[d]=true); buildDayList(); }
  refreshMap();
};
document.getElementById('btnNone').onclick=()=>{
  if(viewMode==='zone'){ Object.keys(zChecked).forEach(z=>zChecked[z]=false); buildZoneList(); }
  else{ Object.keys(dChecked).forEach(d=>dChecked[d]=false); buildDayList(); }
  refreshMap();
};
document.getElementById('hideMode').onchange=e=>{ hideMode=e.target.value; refreshMap(); };

// ---- création de zone ----
document.getElementById('btnNewZone').onclick=()=>{
  document.getElementById('newZoneForm').classList.toggle('on');
  document.getElementById('nzLib').focus();
};
document.getElementById('nzCreate').onclick=()=>{
  if(!isEdit()) return;
  const lib=document.getElementById('nzLib').value.trim().toUpperCase();
  if(!lib){ document.getElementById('nzLib').focus(); return; }
  const code=nextZoneCode();
  customZones[code]={lib, color:document.getElementById('nzColor').value};
  zChecked[code]=true;
  save(); buildZoneList(); buildDayList(); buildPaintSel();
  document.getElementById('nzLib').value='';
  document.getElementById('newZoneForm').classList.remove('on');
  // proposer directement le pinceau sur la nouvelle zone
  document.getElementById('paintTarget').value=code;
  if(!paintMode) document.getElementById('btnPaint').click();
};

// ---- mode édition / consultation ----
function applyEditUI(){
  document.body.classList.toggle('edit', editMode);
  const b=document.getElementById('btnLock');
  b.textContent = editMode ? '🔓 Édition' : '🔒 Consultation';
  b.classList.toggle('unlocked', editMode);
  if(!editMode && paintMode) document.getElementById('btnPaint').click();
}
document.getElementById('btnLock').onclick=()=>{
  if(editMode){
    editMode=false; sessionStorage.removeItem('cartoSectoEdit');
    applyEditUI(); buildZoneList(); renderHist&&0;
    return;
  }
  const p=prompt('Mot de passe organisateur :');
  if(p===null) return;
  if(p===mdp){
    editMode=true; sessionStorage.setItem('cartoSectoEdit','1');
    applyEditUI(); buildZoneList();
  }else{
    alert('Mot de passe incorrect');
  }
};
document.getElementById('btnMdp').onclick=()=>{
  if(!isEdit()) return;
  const p1=prompt('Nouveau mot de passe :');
  if(!p1) return;
  const p2=prompt('Confirme le nouveau mot de passe :');
  if(p1!==p2){ alert('Les deux saisies ne correspondent pas.'); return; }
  mdp=p1; save(); alert('Mot de passe modifié (synchronisé pour tous les organisateurs).');
};

// ---- pinceau ----
function buildPaintSel(){
  const sel=document.getElementById('paintTarget');
  const cur=sel.value;
  sel.innerHTML=Object.entries(allZones()).map(([z,l])=>`<option value="${z}">${z} — ${l}</option>`).join('');
  if(cur && allZones()[cur]) sel.value=cur;
}
document.getElementById('btnPaint').onclick=()=>{
  if(!isEdit()&&!paintMode) return;
  paintMode=!paintMode;
  document.getElementById('btnPaint').classList.toggle('active',paintMode);
  document.getElementById('paintBar').classList.toggle('on',paintMode);
  document.getElementById('map').style.cursor=paintMode?'crosshair':'';
};
document.getElementById('paintStop').onclick=()=>document.getElementById('btnPaint').click();

// ---- export / import / reset ----
document.getElementById('btnExport').onclick=()=>{
  const payload={overrides, zoneDays, customZones, overridesMeta, export:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='carte-secto-modifs.json'; a.click();
  if(Object.keys(overrides).length){
    const csv='Code INSEE;Commune;Zone origine;Nouvelle zone;Libellé nouvelle zone\n'+Object.entries(overrides)
      .map(([i,z])=>`${i};${BASE[i][0]};${BASE[i][2]};${z};${zoneLib(z)}`).join('\n');
    const b2=new Blob(['\ufeff'+csv],{type:'text/csv'});
    const a2=document.createElement('a'); a2.href=URL.createObjectURL(b2); a2.download='reaffectations.csv'; a2.click();
  }
};
document.getElementById('btnImport').onclick=()=>document.getElementById('fileImport').click();
document.getElementById('fileImport').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    if(!isEdit()) return;
    const p=JSON.parse(r.result);
    overrides=p.overrides||{}; zoneDays=p.zoneDays||{}; customZones=p.customZones||{}; overridesMeta=p.overridesMeta||{};
    save(); ensureChecks(); buildZoneList(); buildDayList(); buildPaintSel(); refreshMap();
  }catch(err){ alert('Fichier invalide'); } };
  r.readAsText(f); e.target.value='';
});
function fmtDate(iso){
  if(!iso) return '';
  try{ const d=new Date(iso); return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; }
}
function renderHist(){
  const body=document.getElementById('histBody');
  let html='';

  // Réaffectations (plus récentes en premier)
  const ovr=Object.entries(overrides).sort((a,b)=>(overridesMeta[b[0]]||'').localeCompare(overridesMeta[a[0]]||''));
  html+='<h3>Réaffectations de communes ('+ovr.length+')</h3>';
  if(!ovr.length) html+='<div class="hist-empty">Aucune réaffectation</div>';
  ovr.forEach(([i,z])=>{
    const orig=BASE[i]?BASE[i][2]:'?';
    const nom=BASE[i]?BASE[i][0]:i;
    html+=`<div class="hist-row">
      <span class="swatch" style="background:${zoneColor(z)}"></span>
      <span class="info">${nom} <small>${i} · ${orig} (${zoneLib(orig)}) → ${z} (${zoneLib(z)})${overridesMeta[i]?' · '+fmtDate(overridesMeta[i]):''}</small></span>
      ${isEdit()?`<span class="del" title="Annuler cette réaffectation" onclick="histDelOverride('${i}')">🗑</span>`:''}</div>`;
  });

  // Zones personnalisées
  const cz=Object.entries(customZones);
  html+='<h3>Zones personnalisées ('+cz.length+')</h3>';
  if(!cz.length) html+='<div class="hist-empty">Aucune zone personnalisée</div>';
  cz.forEach(([c,z])=>{
    const nb=Object.values(overrides).filter(v=>v===c).length;
    html+=`<div class="hist-row">
      <span class="swatch" style="background:${z.color}"></span>
      <span class="info">${z.lib} <small>${c} · ${nb} commune(s) affectée(s)</small></span>
      ${isEdit()?`<span class="del" title="Supprimer cette zone (les communes retournent à leur origine)" onclick="histDelZone('${c}')">🗑</span>`:''}</div>`;
  });

  // Jours de passage
  const jd=Object.entries(zoneDays).filter(([,v])=>v&&v.length);
  html+='<h3>Jours de passage ('+jd.length+' zone(s) planifiée(s))</h3>';
  if(!jd.length) html+='<div class="hist-empty">Aucun jour défini</div>';
  jd.forEach(([z,days])=>{
    html+=`<div class="hist-row">
      <span class="swatch" style="background:${zoneColor(z)}"></span>
      <span class="info">${zoneLib(z)} <small>${z} · ${days.join(' · ')}</small></span>
      ${isEdit()?`<span class="del" title="Effacer les jours de cette zone" onclick="histDelDays('${z}')">🗑</span>`:''}</div>`;
  });

  body.innerHTML=html;
  document.getElementById('histCount').textContent=ovr.length+cz.length+jd.length+' modification(s) au total';
}
window.histDelOverride=function(i){
  if(!isEdit()) return;
  delete overrides[i]; delete overridesMeta[i];
  save(); buildZoneList(); refreshMap(); renderHist();
};
window.histDelZone=function(c){
  if(!isEdit()) return;
  const nb=Object.values(overrides).filter(v=>v===c).length;
  if(!confirm('Supprimer la zone '+c+' — '+zoneLib(c)+' ?'+(nb?'\n'+nb+' commune(s) retourneront à leur zone d\'origine.':''))) return;
  Object.keys(overrides).forEach(i=>{ if(overrides[i]===c){ delete overrides[i]; delete overridesMeta[i]; } });
  delete customZones[c]; delete zoneDays[c]; delete zChecked[c];
  save(); buildZoneList(); buildDayList(); buildPaintSel(); refreshMap(); renderHist();
};
window.histDelDays=function(z){
  if(!isEdit()) return;
  delete zoneDays[z];
  save(); buildZoneList(); buildDayList(); refreshMap(); renderHist();
};
document.getElementById('btnReset').onclick=()=>{
  renderHist();
  document.getElementById('histOverlay').classList.add('on');
};
document.getElementById('histClose').onclick=()=>document.getElementById('histOverlay').classList.remove('on');
document.getElementById('histOverlay').addEventListener('click',e=>{
  if(e.target.id==='histOverlay') document.getElementById('histOverlay').classList.remove('on');
});
document.getElementById('histResetAll').onclick=()=>{
  if(!isEdit()){ alert('Passe en mode édition (🔒) pour modifier.'); return; }
  if(!confirm('Tout annuler : réaffectations, zones personnalisées et jours de passage ?')) return;
  overrides={}; overridesMeta={}; customZones={}; zoneDays={};
  save(); buildZoneList(); buildDayList(); buildPaintSel(); refreshMap(); renderHist();
};

// ---- recherche : commune, INSEE ou code postal ----
let _hl=[];
function clearHl(){ _hl.forEach(l=>l.setStyle(styleFor(l._insee))); _hl=[]; }
document.getElementById('search').addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  clearHl();
  const q=e.target.value.trim().toUpperCase(); if(!q) return;
  const isNum=/^\d{2,5}$/.test(q);
  let hits=[];
  if(BASE[q]) hits=[q];
  if(!hits.length && isNum){
    // code postal (exact ou préfixe) — un CP peut couvrir plusieurs communes
    hits=Object.keys(BASE).filter(i=>BASE[i][1].split('/').some(cp=>cp===q||cp.startsWith(q)));
  }
  if(!hits.length) hits=Object.keys(BASE).filter(i=>BASE[i][0].toUpperCase().includes(q));
  hits=hits.filter(i=>layersByInsee[i]);
  if(!hits.length){
    e.target.style.borderColor='#ff4d4d';
    setTimeout(()=>e.target.style.borderColor='',900);
    return;
  }
  const grp=L.featureGroup(hits.map(i=>layersByInsee[i]));
  map.fitBounds(grp.getBounds().pad(hits.length>1?0.15:0.6));
  hits.forEach(i=>{
    const l=layersByInsee[i]; l._insee=i;
    l.setStyle({weight:2.5,color:'#ffffff'}); _hl.push(l);
  });
  if(hits.length===1) layersByInsee[hits[0]].openPopup();
  setTimeout(clearHl,4000);
});
document.getElementById('toggleSidebar').onclick=()=>document.getElementById('sidebar').classList.toggle('open');

// sélecteur de site
(function(){
  const sel=document.getElementById('siteSel');
  sel.innerHTML=Object.entries(SITES).map(([k,s])=>`<option value="${k}" ${k===SITE?'selected':''}>${s.label}</option>`).join('');
  sel.onchange=()=>{
    localStorage.setItem('cartoSectoSite', sel.value);
    const u=new URL(location.href); u.searchParams.set('site', sel.value);
    location.href=u.toString();   // rechargement propre avec le nouveau site
  };
  document.getElementById('pfLabel').textContent=CFG.pf+' — '+CFG.label;
  document.title='Carte sectorielle — '+CFG.label;
})();
applyEditUI();
buildZoneList(); buildDayList(); buildPaintSel(); updateBadge();
initFirebase();
init();
</script>
